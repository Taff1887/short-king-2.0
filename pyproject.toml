[project]
name = "short-king"
version = "0.2.0"
description = "Cross-sectional short-selling research on the ASX (with US robustness) — point-in-time short interest, fundamentals-aware features, learning-to-rank model, and a costed backtest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Taffy Jackson" }]
keywords = [
    "quantitative-finance",
    "short-selling",
    "asx",
    "machine-learning",
    "factor-investing",
    "backtesting",
]

dependencies = [
    # Core scientific stack
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16.0",

    # Data acquisition
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=8.3",
    "yfinance>=0.2.50",
    "tabula-py>=2.9",          # ASIC PDF parser (needs Java in PATH)
    "pdfplumber>=0.11",         # Fallback PDF parser, no Java dependency

    # Configuration & ergonomics
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "rich>=13.7",
    "tqdm>=4.66",

    # Machine learning + stats
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "shap>=0.46",
    "statsmodels>=0.14",

    # Visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",

    # Notebooks
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.25",
]

[project.urls]
Repository = "https://github.com/Taff1887/short-king-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/short_king"]

# =============================================================================
# Tooling
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
